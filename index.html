<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jay Empire VIP Terminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn {
            background: #d97706;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h2>👑 Jay Empire VIP Pass</h2>
    <p>Select your tier to unlock institutional trading setups:</p>

    <div class="card">
        <h3>🧪 1-Day VIP Pass (0.10 GHS)</h3>
        <button class="btn" onclick="payWithPaystack(10, '1_day_test', 'gold', 1)">Unlock Access</button>
    </div>

    <div class="card">
        <h3>🪙 1 Month Gold VIP ($15)</h3>
        <button class="btn" onclick="payWithPaystack(23250, '1_month', 'gold', 30)">Unlock Access</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function payWithPaystack(amountSubunits, planKey, channelType, days) {
            const user = tg.initDataUnsafe.user;
            const userEmail = user ? `user_${user.id}@jayempire.com` : 'client@jayempire.com';

            let handler = PaystackPop.setup({
                key: 'pk_live_c470302d79292c5df97f088509a5a99d39788fc8', // Your Paystack Public Key
                email: userEmail,
                amount: amountSubunits,
                currency: 'GHS',
                metadata: {
                    telegram_id: user ? user.id : 0,
                    channel_type: channelType,
                    days: days
                },
                callback: function(response) {
                    // Send transaction reference back to Bot via WebApp Data
                    tg.sendData(JSON.stringify({
                        reference: response.reference,
                        channel_type: channelType,
                        days: days
                    }));
                    tg.close();
                },
                onClose: function() {
                    alert('Checkout cancelled.');
                }
            });
            handler.openIframe();
        }
    </script>
</body>
</html>
