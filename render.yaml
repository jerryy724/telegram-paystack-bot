services:
  - type: web
    name: telegram-paystack-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

      # Pins the build to Python 3.11.9 so Render can use
      # prebuilt wheels for the project's dependencies.
      - key: PYTHON_VERSION
        value: "3.11.9"

      - key: BOT_TOKEN
        sync: false

      - key: PAYSTACK_SECRET_KEY
        sync: false

      - key: MONGO_URI
        sync: false

      - key: RENDER_EXTERNAL_URL
        sync: false

      - key: MINI_APP_URL
        sync: false

      - key: GOLD_CHANNEL_ID
        sync: false

      - key: FOREX_CHANNEL_ID
        sync: false

      - key: ADMIN_TELEGRAM_ID
        sync: false

      # Required for protected admin API endpoints
      - key: ADMIN_API_KEY
        sync: false

      # Used to authenticate Telegram webhook requests
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false

      # Paystack account country
      - key: PAYSTACK_ACCOUNT_COUNTRY
        value: "ghana"
